[package]
name = "open-arrow-sink-layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable layers for Arrow RecordBatch sinks"

[features]
default = []
download-blob = ["dep:arrow-array"]

[dependencies]
arrow-array = { workspace = true, optional = true }
open-arrow-sink-storage = { workspace = true, features = ["http"] }
open-arrow-sink-core.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
futures.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
arrow-array.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "net", "io-util", "time"] }

[package]
name = "open-arrow-sink-layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable layers for Arrow RecordBatch sinks"

[dependencies]
async-stream = "0.3"
once_cell = "1"
tokio = { workspace = true, features = ["sync"] }
http = { version = "1" }
url = { version = "2" }
opendal = { version = "0.59.5", default-features = false, features = [
  "services-http", "http-transport-reqwest", "executors-tokio", "layers-timeout", "layers-retry",
] }
open-arrow-sink-core.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
futures.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
arrow-array.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

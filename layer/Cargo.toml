[package]
name = "open-arrow-sink-layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable layers for Arrow RecordBatch sinks"

[features]
default = []
download-blob = ["dep:arrow-array", "dep:reqwest", "dep:futures", "dep:tokio"]
rebatch = ["dep:arrow-select"]

[dependencies]
futures = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"], optional = true }
open-arrow-sink-core.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
arrow-select = { version = "58.4", optional = true }
arrow-array = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
] }

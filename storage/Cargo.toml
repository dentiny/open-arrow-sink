[package]
name = "open-arrow-sink-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared OpenDAL storage for Arrow sinks"

[features]
default = []
aws = ["opendal/services-s3"]
gcp = ["opendal/services-gcs"]
azure = ["opendal/services-azblob"]

[dependencies]
async-stream.workspace = true
data-url.workspace = true
object_store.workspace = true
object_store_opendal.workspace = true
bytes.workspace = true
futures.workspace = true
http.workspace = true
httpdate.workspace = true
tokio = { workspace = true, features = ["sync"] }
open-arrow-sink-core.workspace = true
opendal.workspace = true
percent-encoding.workspace = true
url.workspace = true

[dev-dependencies]
more-asserts.workspace = true
open-arrow-sink-test-support.workspace = true
tempfile.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "fs"] }

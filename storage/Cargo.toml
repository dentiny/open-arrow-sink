[package]
name = "open-arrow-sink-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared OpenDAL storage for Arrow sinks"

[features]
default = []
aws = ["opendal/services-s3"]
gcp = ["opendal/services-gcs"]
azure = ["opendal/services-azblob"]

[dependencies]
async-stream.workspace = true
object_store = { version = "0.14.2", default-features = false }
object_store_opendal = { version = "0.60.2", default-features = false }
bytes = "1"
futures.workspace = true
http = "1"
tokio = { workspace = true, features = ["sync"] }
open-arrow-sink-core.workspace = true
opendal = { version = "0.59.2", default-features = false, features = [
  "auto-register-services",
  "services-fs",
  "services-http",
  "http-transport-reqwest",
  "executors-tokio",
  "layers-retry",
  "layers-timeout",
] }
percent-encoding = "2"
url = "2"

[dev-dependencies]
more-asserts.workspace = true
tempfile.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "time", "fs"] }

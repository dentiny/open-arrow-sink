[package]
name = "open-arrow-sink-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared OpenDAL storage for Arrow sinks"

[features]
default = []
http = [
  "opendal/services-http",
  "opendal/http-transport-reqwest",
  "dep:async-stream",
  "dep:once_cell",
]
aws = ["opendal/services-s3", "opendal/http-transport-reqwest"]
gcp = ["opendal/services-gcs", "opendal/http-transport-reqwest"]
azure = ["opendal/services-azblob", "opendal/http-transport-reqwest"]

[dependencies]
async-stream = { workspace = true, optional = true }
once_cell = { workspace = true, optional = true }
bytes = "1"
futures.workspace = true
http = "1"
tokio = { workspace = true, features = ["sync"] }
open-arrow-sink-core.workspace = true
opendal = { version = "0.59.2", default-features = false, features = [
  "auto-register-services",
  "services-fs",
  "executors-tokio",
  "layers-retry",
  "layers-timeout",
] }
percent-encoding = "2"
url = "2"

[dev-dependencies]
more-asserts.workspace = true
tempfile.workspace = true
rstest.workspace = true
tokio = { workspace = true, features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "time",
  "fs",
] }

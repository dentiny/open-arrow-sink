[workspace]
members = [
  "core",
  "test-support",
  "layer",
  "storage",
  "sink/parquet",
  "sink/iceberg",
  "sink/lance",
]
resolver = "2"

[workspace.package]
version = "0.6.5"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/dentiny/open-arrow-sink"

[workspace.dependencies]
data-url = "0.3"
object_store_opendal = { version = "0.60.5", default-features = false }
http = "1"
httpdate = "1"
percent-encoding = "2"
url = "2"
opendal = { version = "0.59.5", default-features = false, features = [
  "auto-register-services",
  "services-fs",
  "services-http",
  "http-transport-reqwest",
  "executors-tokio",
  "layers-retry",
  "layers-timeout",
] }
hex = "0.4"
lance = { git = "https://github.com/lance-format/lance.git", rev = "fc8f59e53233a46f0d73604d66254142802389c9", default-features = false }
lance-encoding = { git = "https://github.com/lance-format/lance.git", rev = "fc8f59e53233a46f0d73604d66254142802389c9", default-features = false }
lance-file = { git = "https://github.com/lance-format/lance.git", rev = "fc8f59e53233a46f0d73604d66254142802389c9", default-features = false }
lance-index = { git = "https://github.com/lance-format/lance.git", rev = "fc8f59e53233a46f0d73604d66254142802389c9", default-features = false }
lance-io = { git = "https://github.com/lance-format/lance.git", rev = "fc8f59e53233a46f0d73604d66254142802389c9", default-features = false }
lance-linalg = { git = "https://github.com/lance-format/lance.git", rev = "fc8f59e53233a46f0d73604d66254142802389c9", default-features = false }
lance-table = { git = "https://github.com/lance-format/lance.git", rev = "fc8f59e53233a46f0d73604d66254142802389c9", default-features = false }
object_store = { version = "0.14.2", default-features = false }
open-arrow-sink-test-support = { path = "test-support" }
async-stream = "0.3"
bytes = "1"
serde = "1"
typetag = "0.2"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "b879b9626754501f025516ce0f0e9535fa6fd414" }
uuid = "1"
more-asserts = "0.3"
rstest = { version = "0.28", default-features = false }
tempfile = "3"
arrow-array = "59.2.0"
arrow-cast = "59.2.0"
arrow-buffer = "59.2.0"
arrow-ord = "59.2.0"
arrow-select = "59.2.0"
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "tokio",
] }
arrow-schema = "59.2.0"
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
parquet = { version = "59.2.0", default-features = false }
tokio = "1"
thiserror = "2"
open-arrow-sink-storage = { path = "storage", version = "0.6.5" }
open-arrow-sink-core = { path = "core", version = "0.6.5" }
open-arrow-sink-layer = { path = "layer", version = "0.6.5" }
open-arrow-sink-parquet = { path = "sink/parquet", version = "0.6.5" }

[package]
name = "open-arrow-sink"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable, independent Arrow RecordBatch sinks"

[features]
default = []
sink-lance = ["dep:open-arrow-sink-lance"]
lance-aws = ["sink-lance", "open-arrow-sink-lance/aws"]
lance-gcp = ["sink-lance", "open-arrow-sink-lance/gcp"]
lance-azure = ["sink-lance", "open-arrow-sink-lance/azure"]
sink-iceberg = ["dep:open-arrow-sink-iceberg"]
sink-parquet = ["dep:open-arrow-sink-parquet"]
parquet-aws = ["sink-parquet", "open-arrow-sink-parquet/aws"]
parquet-gcp = ["sink-parquet", "open-arrow-sink-parquet/gcp"]
parquet-azure = ["sink-parquet", "open-arrow-sink-parquet/azure"]
parquet-snappy = ["sink-parquet", "open-arrow-sink-parquet/snappy"]
parquet-gzip = ["sink-parquet", "open-arrow-sink-parquet/gzip"]
parquet-zstd = ["sink-parquet", "open-arrow-sink-parquet/zstd"]
parquet-lz4 = ["sink-parquet", "open-arrow-sink-parquet/lz4"]

[dependencies]
open-arrow-sink-core.workspace = true
open-arrow-sink-layer.workspace = true
open-arrow-sink-storage.workspace = true
open-arrow-sink-iceberg = { path = "sink/iceberg", version = "0.6.5", optional = true }
open-arrow-sink-parquet = { workspace = true, optional = true }

[dependencies.open-arrow-sink-lance]
path = "sink/lance"
version = "0.6.5"
optional = true

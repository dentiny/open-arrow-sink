[workspace]
members = ["core", "layer", "sink/parquet"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dentiny/open-arrow-sink"

[workspace.dependencies]
arrow-array = "58.4"
arrow-schema = "58.4"
async-trait = "0.1"
thiserror = "2"
open-arrow-sink-core = { path = "core", version = "0.1.0" }
open-arrow-sink-layer = { path = "layer", version = "0.1.0" }

[package]
name = "open-arrow-sink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable, independent Arrow RecordBatch sinks"

[features]
default = []
sink-parquet = ["dep:open-arrow-sink-parquet"]

[dependencies]
open-arrow-sink-core.workspace = true
open-arrow-sink-layer.workspace = true
open-arrow-sink-parquet = { path = "sink/parquet", version = "0.1.0", optional = true }

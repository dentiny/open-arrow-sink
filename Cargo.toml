[workspace]
members = [
  "core",
  "layer",
  "storage",
  "sink/parquet",
  "sink/iceberg",
  "sink/lance",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dentiny/open-arrow-sink"

[workspace.dependencies]
bytes = "1"
serde = "1"
typetag = "0.2"
iceberg = "0.11"
uuid = "1"
more-asserts = "0.3"
rstest = { version = "0.28", default-features = false }
tempfile = "3"
arrow-array = "58.4"
arrow-schema = "58.4"
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
parquet = { version = "58.4", default-features = false }
tokio = "1"
thiserror = "2"
open-arrow-sink-storage = { path = "storage", version = "0.1.0" }
open-arrow-sink-core = { path = "core", version = "0.1.0" }
open-arrow-sink-layer = { path = "layer", version = "0.1.0" }
open-arrow-sink-parquet = { path = "sink/parquet", version = "0.1.0" }

[package]
name = "open-arrow-sink"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Composable, independent Arrow RecordBatch sinks"

[features]
default = []
sink-lance = ["dep:open-arrow-sink-lance"]
sink-iceberg = ["dep:open-arrow-sink-iceberg"]
sink-parquet = ["dep:open-arrow-sink-parquet"]
parquet-snappy = ["sink-parquet", "open-arrow-sink-parquet/snappy"]
parquet-gzip = ["sink-parquet", "open-arrow-sink-parquet/gzip"]
parquet-zstd = ["sink-parquet", "open-arrow-sink-parquet/zstd"]
parquet-lz4 = ["sink-parquet", "open-arrow-sink-parquet/lz4"]

[dependencies]
open-arrow-sink-core.workspace = true
open-arrow-sink-layer.workspace = true
open-arrow-sink-storage.workspace = true
open-arrow-sink-iceberg = { path = "sink/iceberg", version = "0.1.0", optional = true }
open-arrow-sink-parquet = { workspace = true, optional = true }

[dependencies.open-arrow-sink-lance]
path = "sink/lance"
version = "0.1.0"
optional = true

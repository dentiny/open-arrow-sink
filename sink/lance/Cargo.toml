[package]
name = "open-arrow-sink-lance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lance dataset sink over shared OpenDAL storage"

[features]
default = []
aws = ["open-arrow-sink-storage/aws"]
gcp = ["open-arrow-sink-storage/gcp"]
azure = ["open-arrow-sink-storage/azure"]

[dependencies]
bytes.workspace = true
futures.workspace = true
open-arrow-sink-layer.workspace = true
open-arrow-sink-storage.workspace = true
uuid = { workspace = true, features = ["v4"] }
lance-file = { version = "14.0.1", default-features = false }
lance-table = { version = "14.0.1", default-features = false }
lance-io = { version = "14.0.1", default-features = false }
object_store = { version = "0.14.2", default-features = false }
object_store_opendal = { version = "0.60.2", default-features = false }
open-arrow-sink-core.workspace = true
arrow-array.workspace = true
arrow-cast = "58.4"
arrow-schema.workspace = true
lance-index = { version = "14.0.1", default-features = false }
lance-linalg = { version = "14.0.1", default-features = false }
lance = { version = "14.0.1", default-features = false }
tokio = { version = "1", features = ["fs", "rt", "sync"] }

[dev-dependencies]
more-asserts.workspace = true
rstest.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

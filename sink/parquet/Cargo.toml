[package]
name = "open-arrow-sink-parquet"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal local Parquet directory sink"

[features]
default = []
snappy = ["parquet/snap"]
gzip = ["parquet/flate2-zlib-rs"]
zstd = ["parquet/zstd"]
lz4 = ["parquet/lz4"]

[dependencies]
open-arrow-sink-core.workspace = true
parquet = { workspace = true, features = ["arrow", "async"] }
tokio = { workspace = true, features = ["fs", "io-util"] }

uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
open-arrow-sink-layer.workspace = true
rstest.workspace = true
tempfile.workspace = true
futures.workspace = true
arrow-array.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
